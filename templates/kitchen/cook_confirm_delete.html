{% extends "base.html" %}

{% block content %}
  <section class="page-shell form-page-shell">
    <div class="confirm-card">
      <p class="eyebrow">Confirm deletion</p>
      <h1>Delete cook?</h1>
      <p>This will remove the cook profile and its dish assignments.</p>

      <form action="" method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="soft-action danger-action">Delete cook</button>
        <a class="soft-action secondary-action" href="{% url 'kitchen:cook-list' %}">Cancel</a>
      </form>
    </div>
  </section>
{% endblock %}
