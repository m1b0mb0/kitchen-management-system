<header class="app-navbar-wrap">
  <nav class="app-navbar" aria-label="Primary navigation">
    <a class="app-brand" href="{% url 'kitchen:index' %}">Kitchen Manager</a>

    <div class="app-nav-links">
      <a href="{% url 'kitchen:index' %}">Home</a>
      <a href="{% url 'kitchen:cook-list' %}">Cooks</a>
      <a href="{% url 'kitchen:dish-type-list' %}">Dish Types</a>
      <a href="{% url 'kitchen:dish-list' %}">Dishes</a>
      <a href="{% url 'kitchen:ingredient-list' %}">Ingredients</a>
    </div>

    <div class="app-nav-actions">
      {% if user.is_authenticated %}
        <a class="user-chip" href="{{ user.get_absolute_url }}">{{ user.get_username }}</a>
        <form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button class="nav-logout" type="submit">Logout</button>
        </form>
      {% else %}
        <a class="nav-logout" href="{% url 'login' %}?next={{ request.path }}">Login</a>
      {% endif %}
    </div>
  </nav>
</header>
